plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alan.moviebox'
    compileSdk 34

    defaultConfig {
        applicationId "com.alan.moviebox"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
